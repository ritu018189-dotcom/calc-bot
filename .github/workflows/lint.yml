name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check formatting
        run: |
          black --check .
          isort --check-only .
      - name: flake8
        run: flake8 .
      - name: mypy (engines, mfs_parser)
        run: mypy engines mfs_parser
      - name: Byte-compile check
        run: python -m compileall -q main.py engines handlers mfs_parser tests scripts
