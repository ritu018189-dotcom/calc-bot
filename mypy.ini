[mypy]
python_version = 3.10
warn_unused_ignores = True
warn_redundant_casts = True

; Only the dependency-free modules are checked strictly for now — the
; Telegram/Flask/yfinance-facing code (main.py, handlers/) relies on a lot
; of untyped third-party stubs and isn't worth fighting mypy over yet.
[mypy-engines.*]
disallow_untyped_defs = True

[mypy-mfs_parser.*]
disallow_untyped_defs = True

[mypy-yfinance.*]
ignore_missing_imports = True
