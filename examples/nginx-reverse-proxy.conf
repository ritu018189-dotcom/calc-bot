# Example nginx config terminating TLS and forwarding to examples/flask_webhook.py.
# Telegram requires webhooks to be HTTPS on port 443/80/88/8443 — nginx here
# handles the certificate and proxies to the Flask app on localhost:8080.
#
# Get a certificate first, e.g.: certbot certonly --nginx -d bot.example.com

server {
    listen 443 ssl;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    location /webhook {
        proxy_pass http://127.0.0.1:8080/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}
